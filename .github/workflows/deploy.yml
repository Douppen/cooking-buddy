name: Deploy

# Push to main → production (cook.simonnars.com). Also runnable by hand.
# Hackathon mode: no separate check job; a broken app build fails inside `kamal deploy`
# (the Docker build) before anything reaches the box, and kamal-proxy only switches over
# once the new container's /up is healthy.
# Repo secrets: KAMAL_SSH_PRIVATE_KEY, TLS_CERTIFICATE_PEM, TLS_PRIVATE_KEY_PEM,
# GOOGLE_CREDENTIALS_B64.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      TLS_CERTIFICATE_PEM: ${{ secrets.TLS_CERTIFICATE_PEM }}
      TLS_PRIVATE_KEY_PEM: ${{ secrets.TLS_PRIVATE_KEY_PEM }}
      GOOGLE_CREDENTIALS_B64: ${{ secrets.GOOGLE_CREDENTIALS_B64 }}
    steps:
      - uses: actions/checkout@v6

      # Kamal comes from the Gemfile so the installed gems are cached between runs.
      # Kamal makes its own buildx builder and logs in to GHCR itself.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true

      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.KAMAL_SSH_PRIVATE_KEY }}

      - name: Pin SSH host key
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          cat .github/known_hosts >> ~/.ssh/known_hosts

      - name: Release any stale Kamal lock
        run: bundle exec kamal lock release || true

      - name: Deploy
        run: bundle exec kamal deploy

      - name: Verify live
        run: |
          for i in $(seq 1 10); do curl -sf https://cook.simonnars.com/up && exit 0; sleep 3; done
          echo "::error::https://cook.simonnars.com/up did not answer OK"; exit 1
